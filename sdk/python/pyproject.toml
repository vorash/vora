[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vorash"
version = "0.7.0"
description = "Python client for the Vora sandbox API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["vora", "sandbox", "isolation", "containers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "mypy"]

[project.urls]
Homepage = "https://github.com/vorash/vora/tree/main/sdk/python"
Repository = "https://github.com/vorash/vora"

[tool.hatch.build.targets.wheel]
packages = ["src/vora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
