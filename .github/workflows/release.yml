name: Release

# Cuts a release and publishes the artifacts a host needs:
#   * static linux/amd64 binaries (vora, vora-runner, vora-init, vora-api) plus
#     SHA256SUMS and a tarball containing the systemd units, attached to the
#     GitHub release;
#   * sandbox images pushed to GHCR as ghcr.io/<owner>/vora-<name>:<tag>, which
#     the runner pulls by reference (ADR 009).
#
# Triggered by a version tag, or manually for an existing tag (useful when the
# tag predates this workflow, e.g. v0.4.0).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to build and publish (e.g. v0.4.0)
        required: true
        type: string
      skip_images:
        description: Only publish the binaries (skip the GHCR images job)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve the version to build
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          case "$version" in
            v*) ;;
            *) echo "error: version '$version' must start with 'v'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

  binaries:
    name: binaries + release
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release artifacts
        run: ./scripts/release.sh --version "${{ needs.resolve.outputs.version }}"

      - name: Build the Python SDK artifacts
        run: |
          python -m pip install build
          python -m build
        working-directory: sdk/python

      - name: Verify checksums and the reported version
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          ./vora version

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          assets=(
            dist/vora
            dist/vora-runner
            dist/vora-init
            dist/vora-api
            dist/SHA256SUMS
            "dist/vora_${VERSION}_linux_amd64.tar.gz"
            sdk/python/dist/vorash-*.whl
            sdk/python/dist/vorash-*.tar.gz
          )

          # The release stays a draft until every asset is uploaded, so a consumer
          # never sees a half-populated release and a failed upload leaves the
          # draft for inspection instead of publishing something broken.
          #
          # Created through the API rather than `gh release create --draft`: the
          # latter first creates a release under an auto-generated `untagged-…`
          # name and renames it, which leaves asset uploads racing a tag the
          # release does not have yet.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; adding missing assets"
          else
            notes="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$VERSION" --jq .body)"
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$VERSION" \
              -f name="Vora $VERSION" \
              -f body="$notes" \
              -F draft=true \
              -F prerelease=false \
              --jq '"created draft release \(.id) for tag \(.tag_name)"'
          fi

          # Upload one asset at a time and retry: uploads.github.com answers 500
          # ("Error creating asset temp dir") intermittently, which is what
          # stalled the first v0.4.1 run. The failure is transient, so back off
          # and try again rather than failing the release.
          upload() {
            local file="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$VERSION" "$file" --clobber; then
                echo "uploaded $(basename "$file")"
                return 0
              fi
              local wait=$((attempt * 15))
              echo "attempt $attempt failed for $(basename "$file"); retrying in ${wait}s" >&2
              sleep "$wait"
            done
            echo "error: could not upload $(basename "$file") after 5 attempts" >&2
            return 1
          }

          for asset in "${assets[@]}"; do
            upload "$asset" || exit 1
          done

          # Fail loudly if the release is not actually complete before it goes
          # public.
          count="$(gh release view "$VERSION" --json assets --jq '.assets | length')"
          if [[ "$count" -ne "${#assets[@]}" ]]; then
            echo "error: $VERSION has $count assets, want ${#assets[@]}; leaving it as a draft" >&2
            exit 1
          fi

          gh release edit "$VERSION" --draft=false
          gh release view "$VERSION" --json tagName,isDraft,assets \
            --jq '"\(.tagName) draft=\(.isDraft) assets=\(.assets | length)"'

  images:
    name: sandbox images
    needs: resolve
    if: ${{ github.event_name == 'push' || inputs.skip_images != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.version }}

      - name: Publish sandbox images to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          ./scripts/push-images.sh --tag "$VERSION" --registry "ghcr.io/${{ github.repository_owner }}" --login

      - name: Warn about package visibility
        run: |
          echo "Images are pushed as ghcr.io/${{ github.repository_owner }}/vora-{base,python,node}:${{ needs.resolve.outputs.version }}."
          echo "If they are private, every runner needs registry credentials to pull them;"
          echo "record the printed digests in vora-ansible's group_vars/all/all.yml."
