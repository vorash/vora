syntax = "proto3";

package vora.v1;

import "api/proto/v1/common.proto";

option go_package = "github.com/vorash/vora/api/proto/v1;v1";

// RunnerService is the runner control API. It is served over a Unix socket
// in v0.1 and over the network once the control plane is split out.
service RunnerService {
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc GetSandbox(GetSandboxRequest) returns (Sandbox);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc StartSandbox(StartSandboxRequest) returns (Sandbox);
  rpc ExecSandbox(ExecSandboxRequest) returns (stream ExecChunk);
  rpc SignalSandbox(SignalSandboxRequest) returns (SignalSandboxResponse);
  rpc StatsSandbox(StatsSandboxRequest) returns (Stats);
  rpc GetSandboxEvents(GetSandboxEventsRequest) returns (GetSandboxEventsResponse);
  rpc GetSandboxExecs(GetSandboxExecsRequest) returns (GetSandboxExecsResponse);
  rpc GetSandboxEgress(GetSandboxEgressRequest) returns (GetSandboxEgressResponse);
  rpc GetSandboxFile(GetSandboxFileRequest) returns (GetSandboxFileResponse);
  rpc PutSandboxFile(PutSandboxFileRequest) returns (PutSandboxFileResponse);
  rpc DestroySandbox(DestroySandboxRequest) returns (DestroySandboxResponse);
  rpc SnapshotSandbox(SnapshotSandboxRequest) returns (SnapshotSandboxResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (Snapshot);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);
  rpc ForkSnapshot(ForkSnapshotRequest) returns (ForkSnapshotResponse);
}

message CreateSandboxRequest {
  SandboxSpec spec = 1;
  // broker_secrets are the resolved credentials for spec.network.broker_aliases.
  // They are consumed to build the sandbox's broker and are deliberately not
  // part of SandboxSpec so they can never be persisted or returned.
  repeated BrokerCredential broker_secrets = 2;
}

message CreateSandboxResponse {
  Sandbox sandbox = 1;
}

message GetSandboxRequest {
  string sandbox_id = 1;
}

message ListSandboxesRequest {
  // Optional state filter; unset means all non-destroyed sandboxes.
  SandboxState state = 1;
  bool include_destroyed = 2;
}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
}

message StartSandboxRequest {
  string sandbox_id = 1;
}

message ExecSandboxRequest {
  string sandbox_id = 1;
  ExecRequest exec = 2;
}

message SignalSandboxRequest {
  string sandbox_id = 1;
  int32 signal = 2;
}

message SignalSandboxResponse {}

message StatsSandboxRequest {
  string sandbox_id = 1;
}

message GetSandboxEventsRequest {
  string sandbox_id = 1;
}

message GetSandboxEventsResponse {
  repeated SandboxEvent events = 1;
}

// SandboxEvent is one lifecycle transition.
message SandboxEvent {
  string sandbox_id = 1;
  string from = 2;
  string to = 3;
  string reason = 4;
  string runner_id = 5;
  int64 timestamp_unix_ms = 6;
}

message GetSandboxExecsRequest {
  string sandbox_id = 1;
}

message GetSandboxExecsResponse {
  repeated SandboxExec execs = 1;
}

// SandboxExec is one execution audit record.
message SandboxExec {
  string execution_id = 1;
  string command = 2;
  repeated string args = 3;
  string cwd = 4;
  int64 started_at_unix_ms = 5;
  int64 finished_at_unix_ms = 6;
  int32 exit_code = 7;
  ExitReason reason = 8;
  int64 stdout_bytes = 9;
  int64 stderr_bytes = 10;
  // cpu_millis is the CPU consumed during this execution.
  int64 cpu_millis = 11;
  // memory_peak_bytes is the cgroup memory.peak at the end of the execution.
  int64 memory_peak_bytes = 12;
  // egress_allowed/denied count restricted-network decisions in the window.
  int64 egress_allowed = 13;
  int64 egress_denied = 14;
}

message GetSandboxEgressRequest {
  string sandbox_id = 1;
}

message GetSandboxEgressResponse {
  repeated SandboxEgress records = 1;
}

// SandboxEgress is one restricted-network policy decision. alias is set for
// credential-broker decisions and is never a secret value.
message SandboxEgress {
  string sandbox_id = 1;
  string host = 2;
  string remote = 3;
  bool allowed = 4;
  string reason = 5;
  int64 timestamp_unix_ms = 6;
  string alias = 7;
}

message GetSandboxFileRequest {
  string sandbox_id = 1;
  string path = 2;
}

message GetSandboxFileResponse {
  string path = 1;
  bytes content = 2;
}

message PutSandboxFileRequest {
  string sandbox_id = 1;
  string path = 2;
  bytes content = 3;
  // create_parents makes missing parent directories under the sandbox path.
  bool create_parents = 4;
}

message PutSandboxFileResponse {
  string path = 1;
  int64 bytes_written = 2;
}

message DestroySandboxRequest {
  string sandbox_id = 1;
}

message DestroySandboxResponse {}

// Snapshot is a capture of a sandbox's writable state (workspace and home;
// the rootfs stays the shared read-only image — ADR 023). spec is the source
// sandbox's specification; its workspace paths point at the source and are
// replaced by the fork's own layout.
message Snapshot {
  string id = 1;
  string sandbox_id = 2;
  string tenant_id = 3;
  string runner_id = 4;
  SandboxSpec spec = 5;
  int64 bytes = 6;
  int64 created_at_unix_ms = 7;
}

message SnapshotSandboxRequest {
  string sandbox_id = 1;
}

message SnapshotSandboxResponse {
  Snapshot snapshot = 1;
}

message GetSnapshotRequest {
  string snapshot_id = 1;
}

message ListSnapshotsRequest {}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message DeleteSnapshotRequest {
  string snapshot_id = 1;
}

message DeleteSnapshotResponse {}

message ForkSnapshotRequest {
  string snapshot_id = 1;
  // broker_secrets mirror CreateSandboxRequest: resolved credentials for the
  // inherited spec's broker_aliases, transient and never persisted.
  repeated BrokerCredential broker_secrets = 2;
}

message ForkSnapshotResponse {
  Sandbox sandbox = 1;
}
