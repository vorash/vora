syntax = "proto3";

package vora.v1;

import "api/proto/v1/common.proto";

option go_package = "github.com/vorash/vora/api/proto/v1;v1";

// AgentService is served by vora-init inside a Bubblewrap sandbox. It exists
// because Bubblewrap cannot exec into an existing sandbox; the runner reaches
// the agent over a per-sandbox Unix socket bound into the sandbox.
service AgentService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Exec(ExecRequest) returns (stream ExecChunk);
  rpc Signal(SignalRequest) returns (SignalResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  // Capture lists the sandbox's writable mounts. The runner calls it once, before
  // the first workload, and keeps the manifest. The agent stores nothing.
  rpc Capture(CaptureRequest) returns (CaptureResponse);
  // Reset restores the sandbox to manifest and proves it. Any error means the
  // sandbox is not proven clean, and the runner must destroy it.
  rpc Reset(ResetRequest) returns (ResetResponse);
}

message PingRequest {}

message PingResponse {
  int32 pid = 1;
}

message SignalRequest {
  int32 signal = 1;
}

message SignalResponse {}

message ShutdownRequest {}

message ShutdownResponse {}

message CaptureRequest {}

message CaptureResponse {
  // manifest is opaque to the runner: internal/sandboxreset's JSON encoding.
  bytes manifest = 1;
}

message ResetRequest {
  bytes manifest = 1;
}

message ResetResponse {
  uint32 entries_removed = 1;
}
